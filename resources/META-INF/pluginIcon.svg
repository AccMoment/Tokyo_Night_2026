<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="40" height="40" rx="10" fill="#1A1B26"/>

    <!-- Outer glow -->
    <circle cx="20" cy="20" r="13" fill="#24283B"/>
    <circle cx="20" cy="20" r="11.5" stroke="#414868" stroke-width="1"/>

    <!-- Aurora arcs -->
    <path d="M20 8.5C26.35 8.5 31.5 13.65 31.5 20"
          stroke="#7DCFFF" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M20 31.5C13.65 31.5 8.5 26.35 8.5 20"
          stroke="#BB9AF7" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Main snowflake -->
    <g stroke="#C0CAF5" stroke-width="1.35" stroke-linecap="round">
        <path d="M20 12V28"/>
        <path d="M13.1 16L26.9 24"/>
        <path d="M26.9 16L13.1 24"/>
    </g>

    <!-- Branch arrows aligned -->
    <g stroke="#7AA2F7" stroke-width="1.25" stroke-linecap="round">
        <!-- vertical top -->
        <path d="M20 11.9L18.3 14.2"/>
        <path d="M20 11.9L21.7 14.2"/>

        <!-- vertical bottom -->
        <path d="M20 28.1L18.3 25.8"/>
        <path d="M20 28.1L21.7 25.8"/>

        <!-- upper left -->
        <path d="M13 15.9L15.8 15.6"/>
        <path d="M13 15.9L14.1 18.5"/>

        <!-- upper right -->
        <path d="M27 15.9L25.9 18.5"/>
        <path d="M27 15.9L24.2 15.6"/>

        <!-- lower left -->
        <path d="M13 24.1L14.1 21.5"/>
        <path d="M13 24.1L15.8 24.4"/>

        <!-- lower right -->
        <path d="M27 24.1L25.9 21.5"/>
        <path d="M27 24.1L24.2 24.4"/>
    </g>

    <!-- Center crystal -->
    <circle cx="20" cy="20" r="2.6" fill="#BB9AF7"/>
    <circle cx="20" cy="20" r="0.9" fill="#E0E6FF"/>

    <!-- Snow particles -->
    <circle cx="11.5" cy="15" r="0.7" fill="#7DCFFF"/>
    <circle cx="28.5" cy="25" r="0.7" fill="#7DCFFF"/>
</svg>